; =====================================================================================
;  ROBOT 4 BÁNH MECANUM  -  điều khiển bằng tay cầm PS4 (DualShock 4) qua Bluepad32
;  -------------------------------------------------------------------------------------
;  CÁCH DÙNG: mở ĐÚNG thư mục "mecanum-robot" này bằng VS Code (File > Open Folder),
;             rồi bấm nút (→) Upload and Monitor.
;
;  LƯU Ý: đây là project ĐỘC LẬP với project "ps4-controller-to-esp32" ở thư mục gốc.
;         Mỗi lần chỉ mở 1 thư mục trong VS Code.
; =====================================================================================

[env:esp32dev]
platform                = espressif32@6.10.0
board                   = esp32dev
framework               = arduino

monitor_speed           = 115200
monitor_filters         = esp32_exception_decoder

; Tốc độ nạp. Nếu báo lỗi khi nạp, xoá dấu ';' ở dòng dưới để hạ xuống 115200.
; upload_speed          = 115200

; Gỡ lỗi sâu hơn (log của Bluepad32/BTstack) - bình thường CỨ ĐỂ COMMENT lại cho đỡ rối.
; build_flags           = -DCORE_DEBUG_LEVEL=4

; =====================================================================================
;  QUAN TRỌNG - KHÔNG ĐƯỢC XOÁ 3 DÒNG DƯỚI:
;  Tay cầm PS4 (DualShock 4) nói chuyện bằng Bluetooth Classic (BR/EDR).
;  Bluepad32 chỉ có sẵn trong bản arduino-esp32 do tác giả đóng gói riêng,
;  nên ta bắt PlatformIO dùng bản framework đó thay vì bản chính thức.
; =====================================================================================
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

; =====================================================================================
;  Nếu board của bạn không phải "ESP32 Dev Module" hãy đổi 'board' ở trên, ví dụ:
;    board = esp32doit-devkit-v1   ; bản DOIT DevKit V1 (rất phổ biến ở VN)
;    board = esp32wrover           ; board có WROVER / PSRAM
;  (CHỈ dùng chip ESP32 đời đầu: WROOM-32 / WROVER. KHÔNG dùng ESP32-S3 / C3 / C6)
; =====================================================================================
