; ==========================================================================================
;  TAY CAM PS4 (DualShock 4)  ->  ESP32        [ PlatformIO + VS Code ]
; ------------------------------------------------------------------------------------------
;  Cach chay nhanh:
;    1) Mo thu muc nay bang VS Code (da cai extension PlatformIO IDE)
;    2) Cam ESP32 vao may tinh bang cap USB
;    3) Bam "Upload and Monitor" (hoac bam mui ten -> + bieu tuong giong noi)
;
;  !!! QUAN TRONG: Board phai la ESP32 CO Bluetooth Classic:
;        - OK   : ESP32-WROOM-32, ESP32-DevKitC v1/v2/d..., ESP32-WROVER, ESP32-PICO-D4...
;        - KHONG: ESP32-S3, ESP32-C3, ESP32-C6, ESP32-S2 (khong co Bluetooth Classic)
;                 => khong the ket noi tay cam PS4/DualShock 4.
; ==========================================================================================

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200

; -----------------------------------------------------------------------------------------
; Goi framework nay = Arduino-ESP32 + Bluepad32 (ban chinh thuc cua tac gia Bluepad32),
; chi duoc doi ten package cho dung chuan PlatformIO.
;   - Ban goc: https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip
;   - Ban doi ten: https://github.com/maxgerhardt/pio-framework-bluepad32
; Nho goi nay, PlatformIO se:
;   + include san <Bluepad32.h>
;   + link san libbluepad32.a, libbtstack.a... (khong can lib_deps)
; -----------------------------------------------------------------------------------------
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

; Xem log Bluetooth chi tiet cua Bluepad32 khi can debug (0 = khong log, 5 = rat chi tiet)
; build_flags = -DCORE_DEBUG_LEVEL=4

; Giai ma "backtrace" khi ESP32 bi reset (rat huu ich khi gap loi)
monitor_filters = esp32_exception_decoder

[env:esp32dev]
board = esp32dev

; -----------------------------------------------------------------------------------------
; Neu ban dung board ESP32 khac (van phai CO Bluetooth Classic), bo comment va doi ten:
;
; [env:esp32doit-devkit-v1]
; board = esp32doit-devkit-v1
;
; [env:esp32wrover]
; board = esp32wrover
; -----------------------------------------------------------------------------------------
